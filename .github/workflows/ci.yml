name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  frontend-typecheck:
    name: Frontend Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

  rust-tests-linux:
    name: Rust Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update
      - run: sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev pkg-config libasound2-dev libgtk-3-dev libayatana-appindicator3-dev libclang-dev clang cmake libxdo-dev
      - name: Set LIBCLANG_PATH
        run: echo "LIBCLANG_PATH=$(find /usr/lib -name 'libclang.so*' -printf '%h\n' | head -1)" >> "$GITHUB_ENV"
      - name: Setup CMake
        run: echo "CMAKE=$(command -v cmake)" >> "$GITHUB_ENV"
      - working-directory: src-tauri
        run: cargo test -j 1

  rust-tests-windows:
    name: Rust Tests (Windows)
    runs-on: windows-latest
    env:
      # Ensure ORT downloads binaries correctly
      ORT_STRATEGY: download
      ORT_USE_STATIC_LIBS: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Setup CMake
        shell: pwsh
        run: |
          $cmake = "${env:ProgramFiles}\CMake\bin\cmake.exe"
          if (-not (Test-Path -LiteralPath $cmake)) {
            $cmake = (Get-Command cmake.exe -ErrorAction Stop).Source
          }
          "CMAKE=$cmake" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $cmake --version
      - name: Setup DirectML
        shell: pwsh
        run: |
          # Add Windows SDK bin path for DirectML dependencies
          $sdkPath = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64"
          if (Test-Path $sdkPath) {
            echo "$sdkPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - working-directory: src-tauri
        run: cargo test -j 1

  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - run: sudo apt-get update
      - run: sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev pkg-config libasound2-dev libgtk-3-dev libayatana-appindicator3-dev libclang-dev clang cmake libxdo-dev
      - name: Set LIBCLANG_PATH
        run: echo "LIBCLANG_PATH=$(find /usr/lib -name 'libclang.so*' -printf '%h\n' | head -1)" >> "$GITHUB_ENV"
      - name: Setup CMake
        run: echo "CMAKE=$(command -v cmake)" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --bundles appimage,deb

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # Ensure ORT downloads binaries correctly
      ORT_STRATEGY: download
      ORT_USE_STATIC_LIBS: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: dtolnay/rust-toolchain@stable
      - name: Setup CMake
        shell: pwsh
        run: |
          $cmake = "${env:ProgramFiles}\CMake\bin\cmake.exe"
          if (-not (Test-Path -LiteralPath $cmake)) {
            $cmake = (Get-Command cmake.exe -ErrorAction Stop).Source
          }
          if (-not (Test-Path -LiteralPath $cmake)) {
            throw "cmake.exe not found at $cmake"
          }
          "CMAKE=$cmake" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $cmake --version
      - name: Setup DirectML
        shell: pwsh
        run: |
          # Add Windows SDK bin path for DirectML dependencies
          $sdkPath = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64"
          if (Test-Path $sdkPath) {
            echo "$sdkPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --bundles nsis,msi

  build-macos:
    name: Build (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Setup libclang and CMake
        run: |
          brew install llvm cmake
          LLVM_PREFIX="$(brew --prefix llvm)"
          echo "LIBCLANG_PATH=${LLVM_PREFIX}/lib" >> "$GITHUB_ENV"
          echo "CMAKE=$(command -v cmake)" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --bundles app --target aarch64-apple-darwin
      - name: Validate macOS app bundle
        run: |
          APP_PATH="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -type d -print -quit)"
          test -n "$APP_PATH"
          plutil -lint "$APP_PATH/Contents/Info.plist"
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
